name: materialize-stamp-l-pngs
on:
  push:
    branches: [feat/lockd-stamp-l-hotfix]
jobs:
  write-pngs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install librsvg
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Regen PWA PNGs from stamp L master SVG
        run: |
          rsvg-convert -w 192 -h 192 public/brand/app-icon-master.svg -o public/brand/app-icon-192.png
          rsvg-convert -w 512 -h 512 public/brand/app-icon-master.svg -o public/brand/app-icon-512.png
          rsvg-convert -w 1024 -h 1024 public/brand/app-icon-master.svg -o public/brand/app-icon-1024.png
      - name: Commit PNGs and remove one-shot workflow
        run: |
          rm -f .github/workflows/materialize-stamp-l-pngs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/app-icon-192.png public/brand/app-icon-512.png public/brand/app-icon-1024.png
          git add -u .github/workflows/materialize-stamp-l-pngs.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(brand): regen stamp L PNGs (192/512/1024) from master SVG"
          git push
