name: Sync package-lock fonts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/lockd-chrome-rebrand
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package-lock from package.json
        run: |
          set -euo pipefail
          npm install --package-lock-only
          grep -q '@fontsource/barlow-condensed' package-lock.json
          ! grep -q '@fontsource/inter' package-lock.json

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "chore(brand): refresh package-lock for Archivo + Barlow Condensed"
          git push origin HEAD:feat/lockd-chrome-rebrand
