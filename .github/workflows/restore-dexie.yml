name: Restore dexieRepository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/lockd-chrome-rebrand
          fetch-depth: 0

      - name: Restore dexieRepository.ts with stamp accent
        run: |
          set -euo pipefail
          git show 93a1fa6ea1670268a471a2cd681d2303d58a581d:src/db/dexieRepository.ts \
            | sed "s/accentTheme: 'ember'/accentTheme: 'stamp'/" \
            > src/db/dexieRepository.ts
          test "$(wc -c < src/db/dexieRepository.ts)" -ge 30000
          grep -q "accentTheme: 'stamp'" src/db/dexieRepository.ts

      - name: Commit and push to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db/dexieRepository.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(brand): restore dexieRepository; default accentTheme stamp"
          git push origin HEAD:feat/lockd-chrome-rebrand
