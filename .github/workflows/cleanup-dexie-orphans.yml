name: Cleanup orphan dexie splits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lockd-chrome-rebrand
          fetch-depth: 0

      - name: Remove orphan split modules; keep full dexieRepository
        run: |
          set -euo pipefail
          # Full monolithic file must remain
          test "$(wc -c < src/db/dexieRepository.ts)" -ge 30000
          grep -q "accentTheme: 'stamp'" src/db/dexieRepository.ts
          grep -q "export class DexieRepository" src/db/dexieRepository.ts
          # Drop incomplete parallel-agent split leftovers
          for f in src/db/dexieRepository.core.ts \
                   src/db/dexieRepository.templates.ts \
                   src/db/dexieRepository.workouts1.ts \
                   src/db/dexieRepository.workouts2.ts \
                   src/db/dexieRepository.rest.ts \
                   src/db/dexieRepository.helpers.ts \
                   src/db/dexieRepository.exercises.ts \
                   src/db/dexieRepository.measurements.ts \
                   src/db/dexieRepository.import.ts \
                   src/db/dexieRepository.data.ts; do
            if [ -f "$f" ]; then git rm -f "$f"; fi
          done

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet && git diff --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "chore(brand): remove orphan incomplete dexieRepository split modules"
          git push origin HEAD:feat/lockd-chrome-rebrand
