<!doctype html>
<html lang="en" data-theme="dark" data-accent="stamp">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0a0a0b" id="rf-theme-color" />
    <meta
      name="description"
      content="Lock’d — your local-first workout log. Keep the receipt."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lockd" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/app-icon-192.png" />
    <meta property="og:title" content="Lockd" />
    <meta property="og:description" content="Lock’d — your local-first workout log. Keep the receipt." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Lockd" />
    <meta name="twitter:description" content="Lock’d — your local-first workout log. Keep the receipt." />
    <title>Lockd — Keep the receipt.</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('repforge.theme');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var mode = parsed && parsed.mode;
          var accent = parsed && parsed.accent;
          var resolved =
            mode === 'system' || !mode
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode;
          document.documentElement.setAttribute('data-theme', resolved);
          if (accent) document.documentElement.setAttribute('data-accent', accent);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Lock’d needs JavaScript enabled to log workouts.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
